<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inline-agent-widget demo</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fafafa;
        color: #1a1a1a;
      }
      .page {
        max-width: 640px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 20px;
      }
      p {
        color: #555;
        line-height: 1.6;
      }
      code {
        background: #eee;
        padding: 1px 5px;
        border-radius: 4px;
      }
      .nav { margin: 16px 0; }
      .nav a { margin-right: 12px; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>inline-agent-widget — inline demo</h1>
      <p>
        The widget below is an always-visible inline block (not a floating popup). Replace the
        placeholder attributes with your real Salesforce SCRT2 (Agentforce MIAW) values in
        <code>demo/index.html</code>, then reload.
      </p>
      <nav class="nav">
        <a href="?pid=YOUR_PRODUCT_ID">PDP</a>
        <a href="?cgid=mens-clothing-jackets">PLP</a>
        <a href="?q=waterproof+jackets">SRP</a>
      </nav>

      <div id="widget-slot"></div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const slot = document.getElementById("widget-slot");

      if (params.has("cgid")) {
        slot.innerHTML = `
          <h2>PLP — Product Listing / Category Page</h2>
          <p>Category: <code>${params.get("cgid")}</code></p>
          <inline-agent-widget
            scrt2-url="https://YOUR_INSTANCE.salesforce-scrt.com"
            org-id="YOUR_ORG_ID"
            es-developer-name="YOUR_ES_DEVELOPER_NAME"
            capabilities-version="66"
            page-type="plp"
            category-id="${params.get("cgid")}"
            category-name="Men's Jackets"
            category-description="Explore our collection of men's jackets for every season."
            category-questions='["What is on sale?","Most popular?","Any waterproof options?"]'
            placeholder="Ask about this category…"
            enable-logging
          ></inline-agent-widget>`;
      } else if (params.has("q")) {
        slot.innerHTML = `
          <h2>SRP — Search Results Page</h2>
          <p>Search query: <code>${params.get("q")}</code></p>
          <inline-agent-widget
            scrt2-url="https://YOUR_INSTANCE.salesforce-scrt.com"
            org-id="YOUR_ORG_ID"
            es-developer-name="YOUR_ES_DEVELOPER_NAME"
            capabilities-version="66"
            page-type="srp"
            search-query="${params.get("q")}"
            search-questions='["Any deals?","Top rated?","Under $100?"]'
            placeholder="Ask about these results…"
            enable-logging
          ></inline-agent-widget>`;
      } else {
        const pid = params.get("pid") || "YOUR_PRODUCT_ID";
        if (!params.has("pid")) {
          const url = new URL(window.location.href);
          url.searchParams.set("pid", pid);
          window.history.replaceState(null, "", url);
        }
        slot.innerHTML = `
          <h2>PDP — Product Detail Page</h2>
          <p>Product ID: <code>${pid}</code></p>
          <inline-agent-widget
            scrt2-url="https://YOUR_INSTANCE.salesforce-scrt.com"
            org-id="YOUR_ORG_ID"
            es-developer-name="YOUR_ES_DEVELOPER_NAME"
            capabilities-version="66"
            page-type="pdp"
            product-id-param="pid"
            product-name="Classic Trucker Jacket"
            pdp-questions='["Is it waterproof?","Does it fit kids?","What sizes are available?"]'
            placeholder="Ask about this product…"
            persist-session
            enable-logging
            pre-warm
          ></inline-agent-widget>`;
      }
    </script>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
