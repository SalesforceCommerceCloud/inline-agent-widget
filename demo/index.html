<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inline-agent-widget demo</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fafafa;
        color: #1a1a1a;
      }
      .page {
        max-width: 640px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 20px;
      }
      p {
        color: #555;
        line-height: 1.6;
      }
      code {
        background: #eee;
        padding: 1px 5px;
        border-radius: 4px;
      }
      .nav { margin: 16px 0; }
      .nav a { margin-right: 12px; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>inline-agent-widget — inline demo</h1>
      <p>
        The widget below is an always-visible inline block (not a floating popup). Replace the
        placeholder attributes with your real Salesforce SCRT2 (Agentforce MIAW) values in
        <code>demo/index.html</code>, then reload.
      </p>
      <!--
        DEMO CONFIG — replace the placeholders below with your own org's values,
        then reload (`npm run dev`). The three required identifiers come from your
        Embedded Service (Messaging for In-App and Web) deployment in Salesforce
        Setup. They are PUBLIC client identifiers — the same values Salesforce's
        own embedded-messaging snippet exposes in the browser — not secrets:
          • scrt2-url          the SCRT2 base URL, e.g.
                                https://<instance>.salesforce-scrt.com
          • org-id             your 15- or 18-char Salesforce Organization ID
          • es-developer-name  the Embedded Service deployment's developer name
        The placeholders below are not real, so the widget will fail to connect on
        first send until you fill them in (open the browser console; the
        `enable-logging` attribute traces the token → SSE → conversation handshake).

        `persist-session` turns on localStorage-backed persistence so the
        conversation survives reload / navigation. A stored session is reused
        until the token's own JWT `exp` (set by the server at mint); an expired
        token is refused and re-minted. With `enable-logging`, reload+send logs
        "Restoring session for conversation …" (no token mint) on a hit, or
        "persist: no restorable session …" before a fresh handshake.

        Use the nav links below to switch between page types, or set the URL
        param directly: ?pid= for PDP, ?cgid= for PLP, ?q= for SRP.
      -->
      <nav class="nav">
        <a href="?pid=YOUR_PRODUCT_ID">PDP</a>
        <a href="?cgid=YOUR_CATEGORY_ID">PLP</a>
        <a href="?q=YOUR_SEARCH_QUERY">SRP</a>
      </nav>

      <div id="widget-slot"></div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const slot = document.getElementById("widget-slot");

      function createWidget(attrs) {
        const heading = document.createElement("h2");
        heading.textContent = attrs._heading;
        slot.appendChild(heading);

        const widget = document.createElement("inline-agent-widget");
        widget.setAttribute("scrt2-url", "https://YOUR_INSTANCE.salesforce-scrt.com");
        widget.setAttribute("org-id", "YOUR_ORG_ID");
        widget.setAttribute("es-developer-name", "YOUR_ES_DEVELOPER_NAME");
        widget.setAttribute("capabilities-version", "66");
        widget.setAttribute("enable-logging", "");
        for (const [key, value] of Object.entries(attrs)) {
          if (key === "_heading") continue;
          widget.setAttribute(key, value);
        }
        slot.appendChild(widget);
      }

      if (params.has("cgid")) {
        createWidget({
          _heading: "PLP — Product Listing / Category Page",
          "page-type": "plp",
          "category-id": params.get("cgid"),
          "category-name": "YOUR_CATEGORY_NAME",
          "placeholder": "Ask about this category…",
        });
      } else if (params.has("q")) {
        createWidget({
          _heading: "SRP — Search Results Page",
          "page-type": "srp",
          "search-query": params.get("q"),
          "placeholder": "Ask about these results…",
        });
      } else {
        const pid = params.get("pid") || "YOUR_PRODUCT_ID";
        if (!params.has("pid")) {
          const url = new URL(window.location.href);
          url.searchParams.set("pid", pid);
          window.history.replaceState(null, "", url);
        }
        createWidget({
          _heading: "PDP — Product Detail Page",
          "page-type": "pdp",
          "product-id-param": "pid",
          "placeholder": "Type a message…",
          "persist-session": "",
          "pre-warm": "",
        });
      }
    </script>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
