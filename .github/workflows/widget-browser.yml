name: Widget browser checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      [
        'e2e/**',
        'src/**',
        'package*.json',
        'vite*.config.*',
        '.github/workflows/widget-browser.yml',
      ]
  workflow_dispatch:
    inputs:
      live_chat:
        description: Submit one anonymous question to zyss-001
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: widget-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    name: Shared widget contracts (desktop and mobile)
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run build:umd
      - run: npm ci --prefix e2e
      - run: cd e2e && npx playwright install --with-deps chromium
      - run: npm run test:tools --prefix e2e
      - name: Run controlled checks with grouped report steps
        run: npm test --prefix e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: widget-regression
          path: e2e/playwright-report
          retention-days: 14
      - name: Report guide
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          ### Shared widget browser report
          Download **widget-regression**, extract it, and run `npx playwright show-report <extracted-directory>`.
          The HTML contains named scenario steps, per-step durations, coverage annotations and failure traces/screenshots from controlled fixtures. No live agent was contacted by this job.
          REPORT
  live-health:
    name: Live storefront check (explicit opt-in)
    if: >-
      github.repository == 'SalesforceCommerceCloud/inline-agent-widget' &&
      ((github.event_name == 'workflow_dispatch' && inputs.live_chat) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'run-zyss-live-health' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --prefix e2e
      - run: cd e2e && npx playwright install --with-deps chromium
      - run: cd e2e && WIDGET_LIVE_CHAT=1 npx playwright test --project=storefront-readonly --project=storefront-health
      - name: Generate sanitized health report
        if: always()
        working-directory: e2e
        run: node tools/summary.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zyss-health-sanitized
          path: e2e/sanitized-report
          retention-days: 14
          if-no-files-found: error
